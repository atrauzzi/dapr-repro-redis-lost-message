
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mqtt
  labels:
    app: mqtt
spec:
  serviceName: mqtt
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  selector:
    matchLabels:
      app: mqtt
  template:
    metadata:
      labels:
        app: mqtt
    spec:
      volumes:
        - name: mqtt-config
          configMap:
            name: mosquitto-config
      containers:
        - name: mqtt
          image: eclipse-mosquitto:latest
          ports:
            - containerPort: 1883
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: mqtt-data
              mountPath: /mosquitto/data
            - name: mqtt-config
              mountPath: /mosquitto/config
  volumeClaimTemplates:
    - metadata:
        name: mqtt-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/
    persistence_file mosquitto.db
    allow_anonymous true
    listener 1883
    log_type all
    log_dest stdout

---
apiVersion: v1
kind: Service
metadata:
  name: mqtt
  labels:
    app: mqtt
spec:
  selector:
    app: mqtt
  ports:
    - protocol: TCP
      port: 1883
      targetPort: 1883
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: dapr-repro-redis-lost-message
  labels:
    app: dapr-repro-redis-lost-message
spec:
  selector:
    app: dapr-repro-redis-lost-message
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dapr-repro-redis-lost-message-consumer
  labels:
    app: dapr-repro-redis-lost-message-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dapr-repro-redis-lost-message-consumer
  template:
    metadata:
      labels:
        app: dapr-repro-redis-lost-message-consumer
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "dapr-repro-redis-lost-message-consumer"
        dapr.io/app-port: "8080"
        dapr.io/log-level: "debug"
    spec:
      containers:
        - name: dapr-repro-redis-lost-message-consumer
          image: dapr-repro-redis-lost-message-consumer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dapr-repro-redis-lost-message-producer
  labels:
    app: dapr-repro-redis-lost-message-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dapr-repro-redis-lost-message-producer
  template:
    metadata:
      labels:
        app: dapr-repro-redis-lost-message-producer
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "dapr-repro-redis-lost-message-producer"
        dapr.io/app-port: "8080"
        dapr.io/log-level: "debug"
    spec:
      containers:
        - name: dapr-repro-redis-lost-message-producer
          image: dapr-repro-redis-lost-message-producer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

